<style>
:root{--bg:#0e1424;--panel:#161f36;--line:#2a3658;--text:#f3f5fb;--muted:#9aa6c4;
  --blue:#4c8dff;--green:#35c27a;--pink:#ff6b9a;--purple:#a78bfa;--sun:#f5c518;--red:#e2574c;--amber:#ffb020}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif}
.deck{height:calc(100% - 56px);position:relative}
.slide{display:none;position:absolute;inset:0;padding:24px 32px;overflow:auto}
.slide.on{display:block}
.ctl{height:56px;display:flex;gap:10px;align-items:center;justify-content:center;border-top:1px solid var(--line);background:#0a0f1c;padding:0 12px}
.ctl button,.ctl select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer}
.ctl .wkl{color:var(--muted);font-size:13px;margin-left:10px}
.wkflag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:10px;background:#3a2b07;color:var(--amber);font-size:12px}
.ctl .pos{color:var(--muted);font-size:13px;min-width:48px;text-align:center}
.banner{position:fixed;top:10px;right:14px;font-size:12px;padding:5px 10px;border-radius:20px;background:#3a2b07;color:var(--amber);z-index:5}
.banner.live{background:#0d3321;color:var(--green)}
.cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 50% 35%,#1d2c57 0,var(--bg) 65%)}
.cover .t1{font-size:clamp(40px,7vw,84px);font-weight:800;letter-spacing:1px}
.cover .t2{font-size:clamp(20px,3vw,34px);color:var(--sun);margin-top:6px;letter-spacing:6px;text-transform:uppercase}
.cover .t3{color:var(--muted);margin-top:22px;font-size:16px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head .name{font-size:30px;font-weight:800}
.head .tag{font-size:13px;letter-spacing:3px;color:var(--sun);text-transform:uppercase}
.head .sub{color:var(--muted);font-size:14px;width:100%}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--kc);border-radius:10px;padding:12px 14px}
.kpi .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi .val{font-size:28px;font-weight:800;margin-top:4px}
.kpi small{font-size:14px;color:var(--muted);font-weight:400}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:10px;overflow:hidden;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:center}
th{background:#1c2744;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
tr.total td{font-weight:800;background:#1c2744}
.nr{color:#e58a8a}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.gbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.cap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:4px}
.pill{background:#24315a;color:var(--text);border-radius:20px;padding:3px 10px;font-weight:700}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.area{height:190px;position:relative}
.trend .area{height:260px}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h4{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;margin-bottom:10px}
.big{font-size:34px;font-weight:800}
.bar{height:10px;background:#24315a;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green)}
.ok{color:var(--green)}
.lhead{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.lhead .head{margin-bottom:0}
.hphoto{width:92px;height:92px;flex:0 0 92px;border-radius:50%;object-fit:cover;object-position:center top;
  border:3px solid var(--sun);background:linear-gradient(135deg,var(--blue),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff}
@media (max-width:900px){.hphoto{width:68px;height:68px;flex-basis:68px;font-size:24px}}
@media (max-width:900px){.ctl{height:auto;flex-wrap:wrap;padding:8px;gap:6px}.deck{height:calc(100% - 96px)}.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.slide{padding:16px}
  .tblwrap{overflow-x:auto}}
</style>
</head>
<body>
<div class="banner" id="banner">Loading…</div>
<div class="deck" id="deck"></div>
<div class="ctl"><button id="prev">‹ Prev</button><select id="jump"></select><button id="next">Next ›</button><span class="pos" id="pos"></span><span class="wkl">Week</span><select id="week" title="Choose which week to view"></select><button id="reload" title="Reload data">↻</button></div>

<script>
(function () {
var CFG = window.TG_CONFIG, N = CFG.TEAM_SIZE || 20;
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var ITEMS = ['shepherds','prayer','souls','rehearsal','offering','sunday'];

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function key(n){return String(n||'').toLowerCase().replace(/[^a-z]/g,'');}
function initials(n){return n.split(/[\s-]+/).filter(Boolean).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();}
function parseDate(v){
  if(v==null||v==='')return null; if(v instanceof Date)return v;
  var m=/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?/.exec(String(v));
  if(m)return new Date(+m[1],+m[2],+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(v)); if(m)return new Date(+m[3],+m[1]-1,+m[2]);
  var d=new Date(v); return isNaN(d.getTime())?null:d;}
function num(v){if(v==null||v==='')return null;var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n;}
function sunday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+(7-x.getDay())%7);return x;}
function label(d){return d.getDate()+' '+MON[d.getMonth()];}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);
  return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/86400000+1)/7);}
function canon(name){var k=key(name);if(!k)return null;
  for(var i=0;i<CFG.LEADERS.length;i++){var L=key(CFG.LEADERS[i]);if(L===k||L.indexOf(k)===0||k.indexOf(L)===0)return CFG.LEADERS[i];}
  return String(name).trim();}

/* ---------- read the form's response sheet ---------- */
function fetchSheet(){return new Promise(function(resolve,reject){
  var cb='__tg'+Date.now(), t=setTimeout(function(){reject(new Error('The response sheet did not answer. Check it is shared as "Anyone with the link".'));},15000);
  window[cb]=function(resp){clearTimeout(t);delete window[cb];
    if(!resp||resp.status==='error')return reject(new Error('Could not read the response sheet. Check it is shared as "Anyone with the link".'));
    var H=resp.table.cols.map(function(c){return String(c.label||'').toLowerCase().trim();}), col={};
    H.forEach(function(h,i){
      if(h==='timestamp')col.ts=i;
      else if(/leader/.test(h))col.leader=i;
      else if(/shepherd/.test(h)&&!/prayer/.test(h))col.shepherds=i;
      else if(/prayer/.test(h))col.prayer=i;
      else if(/soul/.test(h))col.souls=i;
      else if(/rehearsal/.test(h)&&/offering/.test(h))col.offering=i;
      else if(/rehearsal/.test(h))col.rehearsal=i;
      else if(/sunday/.test(h))col.sunday=i;
      else if(/^date/.test(h))col.date=i;});
    var rows=[];
    resp.table.rows.forEach(function(r){var c=r.c||[];function v(i){return i!=null&&c[i]?c[i].v:null;}
      var ts=parseDate(v(col.ts)), d=parseDate(v(col.date))||ts, leader=canon(v(col.leader));
      if(!d||!leader)return; var row={date:d,ts:ts||d,leader:leader};
      ITEMS.forEach(function(it){row[it]=num(v(col[it]));}); rows.push(row);});
    resolve(rows);};
  var s=document.createElement('script');
  s.src='https://docs.google.com/spreadsheets/d/'+CFG.SHEET_ID+'/gviz/tq?'+(CFG.TAB?'sheet='+encodeURIComponent(CFG.TAB)+'&':'')+'headers=1&tqx=out:json;responseHandler:'+cb;
  s.onerror=function(){clearTimeout(t);reject(new Error('Could not reach the response sheet.'));};
  document.body.appendChild(s);});}

/* ---------- sample data (shown only when SHEET_ID is empty) ---------- */
function sampleRows(){var rows=[],today=sunday(new Date()),seed=7;
  function rnd(a,b){seed=(seed*9301+49297)%233280;return a+Math.floor(seed/233280*(b-a+1));}
  for(var w=5;w>=0;w--){var d=new Date(today);d.setDate(d.getDate()-7*w);
    CFG.LEADERS.forEach(function(L,i){if(w===0&&i===5)return;
      var sh=Math.min(N,rnd(8,14)+(5-w));
      rows.push({date:d,ts:d,leader:L,shepherds:sh,prayer:rnd(4,sh),souls:rnd(0,9),rehearsal:rnd(5,sh+4),
        offering:(w===0&&i===2)?null:rnd(2,12)*10,sunday:rnd(10,sh+8)});});}
  return rows;}

/* ---------- organise by week and leader (latest submission wins) ---------- */
function build(rows){
  rows.sort(function(a,b){return a.ts-b.ts;});
  var weeks={},data={},leaders=CFG.LEADERS.slice();
  rows.forEach(function(r){var s=sunday(r.date),k=s.getTime();weeks[k]=s;
    if(leaders.indexOf(r.leader)<0)leaders.push(r.leader);
    var d=data[r.leader]||(data[r.leader]={}),w=d[k]||(d[k]={});
    ITEMS.forEach(function(it){if(r[it]!=null)w[it]=r[it];});});
  var W=Object.keys(weeks).map(Number).sort(function(a,b){return a-b;})
    .map(function(k){return{key:k,date:weeks[k],wk:isoWeek(weeks[k]),label:label(weeks[k])};});
  function get(L,k,it){var d=data[L]&&data[L][k];return d&&d[it]!=null?d[it]:null;}
  function reported(L,k){return !!(data[L]&&data[L][k]);}
  function total(k,it){var t=0;leaders.forEach(function(L){var v=get(L,k,it);if(v!=null)t+=v;});return t;}
  return{weeks:W,leaders:leaders,get:get,reported:reported,total:total};}

/* ---------- charts ---------- */
var valueLabels={id:'valueLabels',afterDatasetsDraw:function(ch){var ctx=ch.ctx;
  ch.data.datasets.forEach(function(ds,di){var meta=ch.getDatasetMeta(di);if(meta.hidden)return;
    meta.data.forEach(function(el,i){var v=ds.data[i];if(v==null)return;ctx.save();
      ctx.fillStyle=ds.money?'#ffb3ad':'#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(ds.money?'GHS '+v:(ds.of?v+'/'+ds.of:v),el.x,el.y-3);ctx.restore();});});}};
var charts=[];
function chart(canvas,labels,datasets){
  var c=new Chart(canvas,{type:'bar',plugins:[valueLabels],data:{labels:labels,datasets:datasets},
    options:{responsive:true,maintainAspectRatio:false,animation:false,layout:{padding:{top:18}},
      plugins:{legend:{display:false},tooltip:{enabled:true}},
      interaction:{mode:'index',intersect:false},
      onClick:function(e,els){if(els.length&&CURW[els[0].index]){var wk=CURW[els[0].index].key;setTimeout(function(){pickWeek(wk);},0);}},
      onHover:function(e,els){e.native.target.style.cursor=els.length?'pointer':'default';},
      scales:{x:{ticks:{color:'#cfd6ea',font:{size:11}},grid:{display:false}},
        y:{display:false,beginAtZero:true,grace:'25%'},y1:{display:false,beginAtZero:true,grace:'25%',position:'right'}}}});
  charts.push(c);return c;}
function ds(label,data,color,extra){var o={label:label,data:data,backgroundColor:color,borderRadius:4,maxBarThickness:40,yAxisID:'y'};
  for(var k in extra)o[k]=extra[k];return o;}
function photo(L){var p=(CFG.PHOTOS||{})[L],ini='<div class="hphoto">'+esc(initials(L))+'</div>';
  if(!p)return ini;
  return '<img class="hphoto" src="'+esc(p)+'" alt="'+esc(L)+'" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">'+
    '<div class="hphoto" style="display:none">'+esc(initials(L))+'</div>';}
function sw(c,t){return '<span><i class="sw" style="background:'+c+'"></i>'+t+'</span>';}

/* ---------- slides ---------- */
var cur=-1,slides=[],drawn={},SEL=null,MODEL=null,LIVE=false,CURW=[];
function pickWeek(k){var A=MODEL.weeks;SEL=(A.length&&A[A.length-1].key===k)?null:k;render(MODEL,LIVE);}
function render(M,live){
  charts.forEach(function(c){c.destroy();});charts=[];drawn={};
  MODEL=M;LIVE=live;
  var AW=M.weeks,si=-1;AW.forEach(function(w,i){if(w.key===SEL)si=i;});if(si<0)si=AW.length-1;
  var isLatest=si===AW.length-1, W=AW.slice(Math.max(0,si-11),si+1), last=AW[si]||null, k=last?last.key:null, ALL=N*CFG.LEADERS.length;
  CURW=W;
  var wsel=document.getElementById('week');
  wsel.innerHTML=AW.slice().reverse().map(function(w,i){return '<option value="'+w.key+'">WK '+w.wk+' · '+esc(w.label)+(i===0?' (latest)':'')+'</option>';}).join('')||'<option>—</option>';
  if(last)wsel.value=last.key;
  var flag=last&&!isLatest?'<span class="wkflag">past week</span>':'';
  var labels=W.map(function(w){return['WK '+w.wk,w.label];});
  slides=[];
  var banner=document.getElementById('banner');
  banner.className='banner'+(live?' live':'');
  banner.textContent=live?'Live · updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'Sample data — add your SHEET_ID to go live';

  // cover
  slides.push({title:'Cover',html:'<div class="cover"><div class="t1">Team of Grace</div><div class="t2">Weekly Reports</div><div class="t3">'+
    (last?(isLatest?'Latest: ':'Showing: ')+'WK '+last.wk+' · week ending Sunday '+esc(last.label)+' '+last.date.getFullYear()+flag:'No responses yet')+'</div></div>'});

  // weekly summary
  function c(v,of,money){return v==null?'<td class="nr">—</td>':'<td>'+(money?'GHS ':'')+v+(of?' <small style="color:#7f8aa8">/ '+of+'</small>':'')+'</td>';}
  var g=function(L,it){return k==null?null:M.get(L,k,it);};
  var tiles=last?[['Shepherds',M.total(k,'shepherds')+'<small> / '+ALL+'</small>','var(--green)'],
    ['Prayer attendance',M.total(k,'prayer'),'var(--blue)'],['Souls won',M.total(k,'souls'),'var(--pink)'],
    ['Rehearsal attendance',M.total(k,'rehearsal'),'var(--purple)'],['Rehearsal offering','GHS '+M.total(k,'offering'),'var(--red)'],
    ['Sunday attendance',M.total(k,'sunday'),'var(--sun)']]:[];
  var notIn=M.leaders.filter(function(L){return k!=null&&!M.reported(L,k);});
  slides.push({title:'Weekly summary',html:
    '<div class="head"><div class="name">Weekly Summary</div><div class="tag">Team of Grace</div><div class="sub">'+
    (last?'WK '+last.wk+' · week ending '+esc(last.label)+flag+' · '+(M.leaders.length-notIn.length)+' of '+M.leaders.length+' leaders reported'+
      (notIn.length?' · <span class="nr">not in: '+notIn.map(esc).join(', ')+'</span>':''):'')+'</div></div>'+
    '<div class="kpis">'+tiles.map(function(t){return '<div class="kpi" style="--kc:'+t[2]+'"><div class="lab">'+t[0]+'</div><div class="val">'+t[1]+'</div></div>';}).join('')+'</div>'+
    '<div class="tblwrap"><table><thead><tr><th>Leader</th><th>Shepherds</th><th>Prayer</th><th>Souls won</th><th>Rehearsal</th><th>Rehearsal offering</th><th>Sunday</th></tr></thead><tbody>'+
    M.leaders.map(function(L){return '<tr><td>'+esc(L)+'</td>'+c(g(L,'shepherds'),N)+c(g(L,'prayer'))+c(g(L,'souls'))+c(g(L,'rehearsal'))+c(g(L,'offering'),0,1)+c(g(L,'sunday'))+'</tr>';}).join('')+
    (last?'<tr class="total"><td>Total</td><td>'+M.total(k,'shepherds')+' / '+ALL+'</td><td>'+M.total(k,'prayer')+'</td><td>'+M.total(k,'souls')+'</td><td>'+M.total(k,'rehearsal')+'</td><td>GHS '+M.total(k,'offering')+'</td><td>'+M.total(k,'sunday')+'</td></tr>':'')+
    '</tbody></table></div>'});

  // team trends
  slides.push({title:'Team trends',html:
    '<div class="head"><div class="name">Team Trends</div><div class="tag">Week by week</div><div class="sub">Totals across all leaders</div></div>'+
    '<div class="grid2 trend"><div class="gbox"><div class="cap"><span class="pill">Attendance</span>'+sw('var(--blue)','Prayer')+sw('var(--purple)','Rehearsal')+sw('var(--sun)','Sunday')+'</div><div class="area"><canvas id="tA"></canvas></div></div>'+
    '<div class="gbox"><div class="cap"><span class="pill">Souls won</span>'+sw('var(--pink)','Souls won')+'</div><div class="area"><canvas id="tB"></canvas></div></div></div>'+
    '<div class="grid2 trend"><div class="gbox"><div class="cap"><span class="pill">Shepherds</span>'+sw('var(--green)','Total shepherds (target '+ALL+')')+'</div><div class="area"><canvas id="tC"></canvas></div></div>'+
    '<div class="gbox"><div class="cap"><span class="pill">Rehearsal offering</span>'+sw('var(--red)','GHS')+'</div><div class="area"><canvas id="tD"></canvas></div></div></div>',
    draw:function(){function t(it){return W.map(function(w){return M.total(w.key,it);});}
      chart(document.getElementById('tA'),labels,[ds('Prayer',t('prayer'),'#4c8dff'),ds('Rehearsal',t('rehearsal'),'#a78bfa'),ds('Sunday',t('sunday'),'#f5c518')]);
      chart(document.getElementById('tB'),labels,[ds('Souls won',t('souls'),'#ff6b9a')]);
      chart(document.getElementById('tC'),labels,[ds('Shepherds',t('shepherds'),'#35c27a',{of:ALL})]);
      chart(document.getElementById('tD'),labels,[ds('Offering',t('offering'),'#e2574c',{money:true})]);}});

  // one slide per leader
  M.leaders.forEach(function(L,i){var id='L'+i,sh=g(L,'shepherds');
    var miss=[['shepherds','Number of shepherds'],['prayer','Prayer attendance'],['souls','Souls won'],['rehearsal','Rehearsal attendance'],['offering','Rehearsal offering'],['sunday','Sunday attendance']]
      .filter(function(p){return g(L,p[0])==null;});
    slides.push({title:L,html:
      '<div class="lhead">'+photo(L)+'<div class="head"><div class="name">'+esc(L)+'</div><div class="tag">Team of Grace</div><div class="sub">'+(last?(isLatest?'Latest: ':'Showing: ')+'WK '+last.wk+' · week ending '+esc(last.label)+flag:'')+'</div></div></div>'+
      '<div class="grid2"><div>'+
        '<div class="gbox"><div class="cap"><span class="pill">Shepherds · Prayer</span>'+sw('var(--green)','Shepherds (of '+N+')')+sw('var(--blue)','Prayer attendance')+'</div><div class="area"><canvas id="'+id+'a"></canvas></div></div>'+
        '<div class="gbox"><div class="cap"><span class="pill">Rehearsal</span>'+sw('var(--purple)','Attendance')+sw('var(--red)','Offering (GHS)')+'</div><div class="area"><canvas id="'+id+'b"></canvas></div></div>'+
        '<div class="gbox"><div class="cap"><span class="pill">Outreach · Sunday</span>'+sw('var(--pink)','Souls won')+sw('var(--sun)','Sunday attendance')+'</div><div class="area"><canvas id="'+id+'c"></canvas></div></div>'+
      '</div><div class="side">'+
        '<div class="card"><h4>Shepherds toward target</h4><div class="big">'+(sh==null?'<span class="nr">—</span>':sh)+' <small style="font-size:16px;color:var(--muted)">/ '+N+'</small></div>'+
          '<div class="bar"><i style="width:'+Math.min(100,Math.round((sh||0)/N*100))+'%"></i></div></div>'+
        '<div class="card"><h4>'+(last?'WK '+last.wk+' · ':'')+'Report check</h4>'+
          (k!=null&&!M.reported(L,k)?'<div class="nr">✗ No report this week</div>':
            miss.length?miss.map(function(m){return '<div class="nr">✗ '+m[1]+': not reported</div>';}).join(''):'<div class="ok">✓ Everything reported</div>')+'</div>'+
      '</div></div>',
      draw:function(){function col(it){return W.map(function(w){return M.get(L,w.key,it);});}
        chart(document.getElementById(id+'a'),labels,[ds('Shepherds',col('shepherds'),'#35c27a',{of:N}),ds('Prayer',col('prayer'),'#4c8dff')]);
        chart(document.getElementById(id+'b'),labels,[ds('Rehearsal',col('rehearsal'),'#a78bfa'),ds('Offering',col('offering'),'#e2574c',{money:true,yAxisID:'y1'})]);
        chart(document.getElementById(id+'c'),labels,[ds('Souls won',col('souls'),'#ff6b9a'),ds('Sunday',col('sunday'),'#f5c518')]);}});});

  document.getElementById('deck').innerHTML=slides.map(function(s,i){return '<section class="slide" id="sl'+i+'">'+s.html+'</section>';}).join('');
  document.getElementById('jump').innerHTML=slides.map(function(s,i){return '<option value="'+i+'">'+(i+1)+'. '+esc(s.title)+'</option>';}).join('');
  var want=cur>=0?cur:(parseInt(location.hash.slice(1),10)||1)-1; cur=-1; go(want);}

function go(i){i=Math.max(0,Math.min(slides.length-1,i));if(i===cur)return;
  if(cur>=0&&document.getElementById('sl'+cur))document.getElementById('sl'+cur).classList.remove('on');
  cur=i;document.getElementById('sl'+i).classList.add('on');document.getElementById('jump').value=i;
  document.getElementById('pos').textContent=(i+1)+' / '+slides.length;
  if(slides[i].draw&&!drawn[i]){drawn[i]=1;slides[i].draw();}
  history.replaceState(null,'','#'+(i+1));}

function load(){
  if(!CFG.SHEET_ID){render(build(sampleRows()),false);return;}
  fetchSheet().then(function(rows){render(build(rows),true);}).catch(function(e){
    var b=document.getElementById('banner');b.className='banner';b.textContent=e.message;
    if(!slides.length)render(build([]),false);});}

document.getElementById('prev').onclick=function(){go(cur-1);};
document.getElementById('next').onclick=function(){go(cur+1);};
document.getElementById('jump').onchange=function(e){go(+e.target.value);};
document.getElementById('reload').onclick=load;
document.getElementById('week').onchange=function(e){pickWeek(+e.target.value);};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
load();
if(CFG.SHEET_ID&&CFG.REFRESH_MINUTES)setInterval(load,CFG.REFRESH_MINUTES*60000);
})();
</script>
